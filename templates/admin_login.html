<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chandan Steel Security QR Tracker - Admin Portal Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_login.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <script src="{{ url_for('static', filename='js/admin_login.js') }}"></script>
</head>
<body>
    <!-- 🏢 UNIFIED SCREEN-FROZEN TOP CONTROL HEADER CONSOLE BAR -->
    <div style="position: fixed; top: 0; left: 0; right: 0; background: #1e2229; z-index: 9997; border-bottom: 3px solid #007bff; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column; width: 100%; box-sizing: border-box;">
        <!-- 🎛️ TOP ROW CONSOLE LAYER: Places Corporate Logo Left and 3D Title Center -->
        <div class="control-header" style="height: 100px; padding: 10px 25px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; box-sizing: border-box; width: 100%;">
            <!-- Left Section Block: Corporate Logo Asset -->
            <div style="display: flex; justify-content: flex-start; align-items: center;">
                <div style="background: #f8fafcf6; padding: 4px 8px; border-radius: 8px; border: 1px solid #007bff; display: inline-flex; align-items: center; justify-content: center; height: 56px; box-sizing: border-box;">
                    <img src="{{ url_for('static', filename='images/logo-floated.png') }}" alt="Chandan Steel Enterprise Logo" style="height: 42px; max-width: 100%; display: block; object-fit: contain;">
                </div>
            </div>
            <!-- Middle Section Block: High-Contrast 3D Title -->
            <div style="display: flex; justify-content: center; align-items: center; padding-top: 10px; box-sizing: border-box;">
                <h2 style="margin: 0; font-size: 36px; color: #ffffff; font-weight: 900; font-family: 'Arial Black', sans-serif; letter-spacing: 0.5px; text-transform: uppercase; text-align: center; white-space: nowrap;
                           text-shadow: 1px 1px 0px #007bff, 
                                        2px 2px 0px #0056b3, 
                                        3px 3px 0px #004085, 
                                        4px 4px 5px rgba(0, 0, 0, 0.6);">
                    Chandan Steel Plant Tour
                </h2>
            </div>
            <!-- Right Section Block: Balanced Column Empty Spacer -->
            <div style="display: flex; justify-content: flex-end; align-items: center;"></div>
        </div>
    </div>

    <!-- 🎯 SINGLE LAYOUT SPACER ELEMENT: Offset height to match fixed header layout height rules -->
    <div style="height: 115px; width: 100%;"></div>

    <div class="custom-modal-overlay" id="global-system-modal-carrier">
        <div class="custom-modal-box" id="modal-theme-box">
            <div class="modal-icon-badge" id="modal-graphic-symbol">✅</div>
            <h3 class="modal-content-title" id="modal-header-title">Notification Header</h3>
            <p class="modal-content-desc" id="modal-body-text">Alert message goes here.</p>
            <button type="button" class="modal-dismiss-btn" onclick="dismissCentralOverlayModal()">Dismiss Notification</button>
        </div>
    </div>
    <main style="max-width: 1200px; margin: 0 auto; padding: 20px;">
        <div class="login-container" style="max-width: 420px; margin: 40px auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
            <div style="text-align: center; margin-bottom: 20px;">
                <img src="{{ url_for('static', filename='images/logo-floated.png') }}" style="height: 60px; max-width: 100%;">
                <h2 style="color: #dc2626;">Admin Node Access Gateway</h2>
            </div>
            <form method="POST">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="display:block; font-size:12px; font-weight:700; margin-bottom:5px; text-transform:uppercase; color:#475569;">Admin Handle Name</label>
                    <input type="text" name="username" placeholder="Enter Administrative Username" required autocomplete="off" style="width:100%; padding:10px; box-sizing:border-box; border:1px solid #cbd5e1; border-radius:6px;">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display:block; font-size:12px; font-weight:700; margin-bottom:5px; text-transform:uppercase; color:#475569;">Master Access Key Password</label>
                    <input type="password" name="password" placeholder="Admin Account Password" required style="width:100%; padding:10px; box-sizing:border-box; border:1px solid #cbd5e1; border-radius:6px;">
                </div>
                <button type="submit" class="btn-submit" style="width:100%; padding:12px; background:#dc2626; color:white; font-weight:bold; border:none; border-radius:6px; cursor:pointer; font-size:15px;">Authorize & Connect Master Node</button>
                
                <!-- ADMIN FORGOT PASSWORD OPTIONS LINK IN STRICT RED COLOUR -->
                <div style="text-align: center; margin-top: 15px; font-size: 13px;">
                    <a href="{{ url_for('admin_forgot_password') }}" style="color: #dc2626; text-decoration: none; font-style: italic; font-weight: 600; transition: color 0.15s ease;" onmouseover="this.style.color='#991b1b'" onmouseout="this.style.color='#dc2626'">Forgot admin credentials? Recover access</a>
                </div>
                
                <!-- NAVIGATION ROW TARGETS USER BLUE: "Return to User Login" IN BLUE COLOUR -->
                <div style="text-align: center; margin-top: 20px; font-size: 14px; border-top: 1px solid #f1f5f9; padding-top: 15px;">
                    <span style="color: #64748b;">Not an Admin?</span> 
                    <a href="{{ url_for('login') }}" style="color: #3b82f6; text-decoration: none; font-weight: 700; transition: color 0.15s ease;" onmouseover="this.style.color='#1d4ed8'" onmouseout="this.style.color='#3b82f6'">Return to User Login</a>
                </div>
            </form>
        </div>
    </main>

    <!-- CSS Padding Spacer to prevent the frozen footer from hiding scrolling data fields -->
    <div style="height: 65px; width: 100%;"></div>

    <!-- 🏢 FROZEN INFRASTRUCTURE SYSTEM FOOTER CONSOLE BAR -->
    <footer style="position: fixed; bottom: 0; left: 0; right: 0; height: 38px; background: #1e2229; padding: 0 25px; border-top: 3px solid #007bff; font-family: sans-serif; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; z-index: 9998; box-shadow: 0 -4px 12px rgba(15, 23, 42, 0.25);">
        <!-- Left Aligned Section -->
        <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.2px; display: inline-flex; align-items: center; gap: 4px; color: #94a3b8; flex: 1; justify-content: flex-start;"> 
            © 2026 <span style="color: #007bff; font-weight: 800; margin: 0 2px;">Chandan Steel Plant Tour</span> 
        </div> 

        <!-- Center-Aligned Powered By Section -->
        <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.2px; color: #94a3b8; flex: 1; text-align: center;">
            Powered by 94sk04 All Rights Reserved.
        </div>

        <!-- Right Aligned Section: Screen-Frozen Dark High-Contrast Terminal Clock Box --> 
        <div style="display: flex; justify-content: flex-end; flex: 1;"> 
            <div style="background: #0f172a; padding: 5px 12px; border-radius: 6px; border: 1px solid #007bff; display: inline-flex; align-items: center; gap: 8px;"> 
                <span style="font-size: 10px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px;">System Terminal Time:</span> 
                <strong id="frozen-footer-terminal-clock" style="font-size: 13px; color: #f8fafc; font-family: monospace; font-weight: 800;">3/8/2026, 2:57:04 pm</strong> 
            </div> 
        </div> 
    </footer>

    <script>
        
    </script>
</body>
</html>
